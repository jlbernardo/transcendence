  accounts_service:
    build:
      context: ..
      dockerfile: infra/accounts_service.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
    volumes:
      - ../core/accounts_service:/app
    restart: always

  # game_service:
  #   build:
  #     context: ..
