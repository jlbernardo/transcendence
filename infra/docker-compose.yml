services:
  app:
    networks:
      - transcendence_network
    build:
      context: ../app
      dockerfile: ../infra/app.Dockerfile
    image: app
    container_name: app
    ports:
      - "3000:3000"
    environment:
      - GAME_SERVICE_URL=http://game_service:3002/ws
  
    depends_on:
      - accounts_service
      - game_service
    restart: always

  accounts_service:
    networks:
      - transcendence_network
    build:
      context: ..
      dockerfile: infra/accounts_service.Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ../core/accounts_service:/app
    restart: always

  game_service:
    networks:
      - transcendence_network
    build:
      context: ..
      dockerfile: infra/game_service.Dockerfile
    ports:
      - "3002:3002"
    environment:
      - DEBUG=False
    restart: always

  ngrok_accounts_service:
    networks: 
      - transcendence_network
    build:
      context: ..
      dockerfile: infra/ngrok.Dockerfile
    image: ngrok_accounts_service
    container_name: ngrok_accounts_service
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - accounts_service
    restart: always

networks:
  transcendence_network:
    driver: bridge
    name: transcendence_network