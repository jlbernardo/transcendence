  ngrok_accounts_service:
    build:
      context: ..
      dockerfile: infra/ngrok.Dockerfile
    image: ngrok
    container_name: ngrok_accounts_service
    environment:
      - NGROK_AUTHTOKEN=31ZN8je7Gz1VwB96jp6ljpLfATm_6zfJHDU1miPTNH4AifVnZ
    ports:
      - "4041:4040"
    volumes:
      - ../infra/accounts_service.yml:/app/ngrok.yml:ro
    depends_on:
      - accounts_service
    restart: always