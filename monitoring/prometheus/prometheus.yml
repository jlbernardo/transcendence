global:
  scrape_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'django-backend'
    static_configs:
      - targets: ['backend:8000'] # Nome do serviço

  - job_name: 'go-game-server'
    static_configs:
      - targets: ['game-server:8080']